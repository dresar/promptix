name: promptix
description: "Promptix - Optimasi Gambar AI Lokal, Cepat, dan Aman"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.2.0

  # Image Processing
  image: ^4.2.0

  # File Picker
  image_picker: ^1.1.2
  file_picker: ^8.1.2

  # Storage & Path
  path_provider: ^2.1.4
  path: ^1.9.0

  # Permissions
  permission_handler: ^11.3.1

  # Local Storage
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3+1

  # Sharing & Opening
  share_plus: ^10.0.3
  open_filex: ^4.3.4

  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

  # Utilities
  intl: ^0.19.0
  mime: ^1.0.6
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: "assets/images/logo.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
